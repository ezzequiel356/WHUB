server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router (BrowserRouter): cualquier ruta que no matchee un
    # archivo real cae en index.html, así /perfil, /catalogo, etc. no dan
    # 404 al recargar la página.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mismo rol que el proxy de vite.config.js en desarrollo, pero apuntando
    # al contenedor del backend por su nombre de servicio Docker.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
}
